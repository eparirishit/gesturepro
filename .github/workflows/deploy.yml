name: Deploy to Google Cloud

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deploy_database:
        description: 'Deploy database'
        required: false
        default: 'true'
        type: boolean
      deploy_backend:
        description: 'Deploy backend'
        required: false
        default: 'true'
        type: boolean

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  DATABASE_INSTANCE_NAME: gesturepro-db
  BACKEND_SERVICE_NAME: gesturepro-backend
  ARTIFACT_REGISTRY_REPO: gesturepro-repo
  IMAGE_NAME: gesturepro-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GCP_REGION-docker.pkg.dev

      - name: Create Artifact Registry Repository
        run: |
          # Create Artifact Registry repository if it doesn't exist
          if ! gcloud artifacts repositories describe $ARTIFACT_REGISTRY_REPO --location=$GCP_REGION --project=$GCP_PROJECT_ID 2>/dev/null; then
            echo "Creating Artifact Registry repository..."
            gcloud artifacts repositories create $ARTIFACT_REGISTRY_REPO \
              --repository-format=docker \
              --location=$GCP_REGION \
              --project=$GCP_PROJECT_ID
          else
            echo "Artifact Registry repository already exists..."
          fi

      - name: Deploy Database
        if: github.event.inputs.deploy_database != 'false'
        run: |
          echo "Deploying Cloud SQL database..."
          
          # Check if database instance exists
          if ! gcloud sql instances describe $DATABASE_INSTANCE_NAME --project=$GCP_PROJECT_ID 2>/dev/null; then
            echo "Creating new Cloud SQL instance..."
            gcloud sql instances create $DATABASE_INSTANCE_NAME \
              --database-version=POSTGRES_14 \
              --tier=db-f1-micro \
              --region=$GCP_REGION \
              --project=$GCP_PROJECT_ID
            
            # Create database
            gcloud sql databases create gesturepro \
              --instance=$DATABASE_INSTANCE_NAME \
              --project=$GCP_PROJECT_ID
            
            # Create database user
            gcloud sql users create appuser \
              --instance=$DATABASE_INSTANCE_NAME \
              --password=${{ secrets.DB_PASSWORD }} \
              --project=$GCP_PROJECT_ID
          else
            echo "Database instance already exists, skipping creation..."
          fi

      - name: Build and Push Backend Docker Image
        if: github.event.inputs.deploy_backend != 'false'
        run: |
          echo "Building Docker image for the backend..."
          docker build -t $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:latest -f .github/docker/Dockerfile.prod .
          
          echo "Pushing Docker image to Artifact Registry..."
          docker push $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:latest

      - name: Deploy Backend to Cloud Run
        if: github.event.inputs.deploy_backend != 'false'
        run: |
          echo "Deploying the backend to Google Cloud Run..."
          gcloud run deploy $BACKEND_SERVICE_NAME \
            --image $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REGISTRY_REPO/$IMAGE_NAME:latest \
            --platform managed \
            --region $GCP_REGION \
            --allow-unauthenticated \
            --project $GCP_PROJECT_ID \
            --port=8000 \
            --set-env-vars="CLOUD_SQL_CONNECTION_NAME=$GCP_PROJECT_ID:$GCP_REGION:$DATABASE_INSTANCE_NAME,DB_USER=appuser,DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=gesturepro,GCS_BUCKET_NAME=gesturepro-models,GCS_MODEL_PATH=models/yolo/yolo_best.pt,GCS_CLASS_NAMES_PATH=models/yolo/class_names.json" \
            --add-cloudsql-instances=$GCP_PROJECT_ID:$GCP_REGION:$DATABASE_INSTANCE_NAME \
            --memory=4Gi \
            --cpu=1 \
            --max-instances=3

      - name: Output Deployment URLs
        run: |
          echo "Deployment completed successfully!"
          BACKEND_URL=$(gcloud run services describe $BACKEND_SERVICE_NAME --region=$GCP_REGION --format='value(status.url)' --project=$GCP_PROJECT_ID)
          echo "Backend URL: $BACKEND_URL"
          echo "Database Instance: $DATABASE_INSTANCE_NAME"